version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
    volumes:
      - ../packages:/packages:ro
      - ../domains:/domains:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  telegram-bot:
    build:
      context: ../apps/telegram-bot
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      - BACKEND_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
